[package]
name = "threadmark-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
threadmark-db.workspace = true
serde.workspace = true
thiserror.workspace = true
directories = "6"
tracing.workspace = true
serde_json.workspace = true
tree-sitter = "0.27.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
ignore = "0.4.33"
blake3 = "1"
json5 = "1.3.1"
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
notify = "8.2.0"


[dev-dependencies]
tempfile = "3"
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = {version="0.61",features=["Win32_Storage_FileSystem","Win32_Foundation"]}

[target.'cfg(windows)'.dev-dependencies]
windows-sys = {version="0.61",features=["Win32_System_ProcessStatus","Win32_System_Threading"]}
